<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Self-Edit Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: an instrument console. Run strip on top (one card per run), then the selected run: chart + events, turn log, notebook. */
:root {
  --bg: #f3f4f1; --panel: #ffffff; --ink: #1d2326; --muted: #667075; --line: #dde1dc;
  --accent: #2856a8;            /* edited model */
  --base: #8a949a;              /* unedited model */
  --good: #2b7a4b; --warn: #a86a12; --bad: #b3362c;
  --code: #f6f7f4;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14181b; --panel: #1b2024; --ink: #e3e7e8; --muted: #8e999e; --line: #2c3338;
          --accent: #7aa2f0; --base: #7b858a; --good: #5fbf85; --warn: #e0a548; --bad: #ef7a6e; --code: #161a1d; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
.wrap { max-width: 1400px; margin: 0 auto; padding-block: 18px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 { font: 600 19px/1.2 var(--sans); margin: 0; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: 13px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
.dot.live { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
.dot.err { background: var(--bad); }

.runs { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: grid; gap: 8px; cursor: pointer; text-align: left; color: inherit; font: inherit; }
.card:hover { border-color: var(--muted); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card.sel { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.card .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card .name { font: 600 14px var(--mono); overflow-wrap: anywhere; }
.where { color: var(--muted); font-size: 12px; }
.pill { font: 500 11px/1 var(--mono); padding: 4px 7px; border-radius: 3px; border: 1px solid currentColor; white-space: nowrap; text-transform: uppercase; letter-spacing: .04em; }
.pill.good { color: var(--good); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.mute { color: var(--muted); } .pill.acc { color: var(--accent); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }

.detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 18px; align-items: start; }
@media (max-width: 980px) { .detail { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; min-width: 0; }
.panel h2 { font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 10px; display: flex; justify-content: space-between; gap: 8px; }
.col { display: grid; gap: 18px; min-width: 0; }
svg text { fill: var(--muted); font: 11px var(--mono); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 4px; flex-wrap: wrap; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

.turns { display: grid; gap: 10px; }
.turn { border: 1px solid var(--line); border-radius: 5px; padding: 10px 12px; display: grid; gap: 8px; min-width: 0; }
.turn.trip { border-color: var(--bad); box-shadow: inset 3px 0 0 var(--bad); }
.turn.edit { box-shadow: inset 3px 0 0 var(--accent); }
.turn .th { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.turn .th b { color: var(--ink); font: 600 13px var(--mono); }
.reply { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; max-width: 95ch; }
details { border-top: 1px dashed var(--line); padding-top: 6px; }
summary { cursor: pointer; font: 500 12px var(--mono); color: var(--muted); }
summary:focus-visible { outline: 2px solid var(--accent); }
pre { margin: 6px 0 0; background: var(--code); border: 1px solid var(--line); border-radius: 4px; padding: 10px; overflow-x: auto; font: 12px/1.45 var(--mono); max-height: 520px; white-space: pre; }
pre.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
.trip-msg { color: var(--bad); font: 500 12.5px var(--mono); }
.events { display: grid; gap: 4px; font: 12px var(--mono); max-height: 260px; overflow-y: auto; }
.events div { display: flex; gap: 8px; } .events .t { color: var(--muted); flex: none; }
.empty { color: var(--muted); font-size: 13px; }
button.more { background: none; border: 0; color: var(--accent); font: 500 12px var(--mono); padding: 0; cursor: pointer; }
.gpu { font: 12px var(--mono); color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .dot.live { transition: box-shadow .3s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Self-Edit Monitor</h1>
    <span class="sub">Qwen models reading and editing weights with forward passes only · 27B editing itself</span>
    <span class="sub mono" id="clock"><span class="dot"></span>connecting…</span>
  </header>
  <section class="runs" id="machines" aria-label="Machines"></section>
  <section class="runs" id="runs" aria-label="Runs"><p class="empty">Waiting for the first poll of the GPU machines…</p></section>
  <section class="detail" id="detail"></section>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const ago = t => { if (!t) return "–"; const s = Date.now() / 1000 - t; return s < 90 ? `${Math.round(s)} s ago` : s < 5400 ? `${Math.round(s / 60)} min ago` : `${(s / 3600).toFixed(1)} h ago`; };
const pct = x => x == null ? "–" : (100 * x).toFixed(1) + "%";
let SNAP = null, SEL = null, OPEN = new Set(), SHOWN = 30, LASTKEY = "";
try { SEL = localStorage.getItem("wsp-sel"); } catch (e) {}

function runsOf(snap) {
  const out = [];
  for (const [host, h] of Object.entries(snap.hosts || {}))
    for (const dir of [...new Set([...(h.configured || []), ...Object.keys(h.runs || {})])]) {
      const r = (h.runs || {})[dir] || {missing: true, turns: [], log: []};    // configured but no data yet: still gets a card
      out.push({key: host + "|" + dir, host, h, dir, r, name: dir.split("/").filter(Boolean).pop()});
    }
  return out;
}
function series(r) {            // accuracy points from the harness log: each result follows the pass that produced it
  let pass = null, req = null; const pts = [], events = [];
  for (const e of r.log || []) {
    if (e.pass != null) { pass = e.pass; req = e.req; }
    if (e.result) pts.push({pass, req, time: e.time, base: e.result.base?.acc, edited: e.result.edited?.acc,
                            cut: (e.result.edited || e.result.base)?.cut});
    if (e.event) events.push(e);
  }
  return {pts, events};
}
function lastPaired(r) {
  for (let i = (r.turns || []).length - 1; i >= 0; i--) {
    const m = /paired[_a-z]*:?\s*\{'mean':\s*(-?[\d.e-]+),\s*'se':\s*([\d.e-]+)/.exec(r.turns[i].output || "");
    if (m) return {mean: +m[1], se: +m[2], turn: r.turns[i].turn};
  }
  return null;
}
function status(x) {
  if (x.r.missing) return [x.h.error ? "unreachable" : "waiting", x.h.error ? "bad" : "mute"];
  if (x.r.exists === false) return ["not started", "mute"];
  if (x.r.agent_alive) return ["running", "good"];
  if (x.r.server_alive) return ["server only", "warn"];
  return ["stopped", "mute"];
}
const editsOf = r => { const e = r.state?.edits; return !e ? [] : Array.isArray(e) ? e : Object.keys(e); };
const shortT = n => n.replace(/^model\.(language_model\.)?layers\./, "L").replace(".weight", "").replace("mlp.down_proj", "down").replace("self_attn.o_proj", "o_proj");

function card(x) {
  const r = x.r, [st, cls] = status(x), used = r.state?.used ?? 0, budget = r.state?.budget ?? 0, p = lastPaired(r);
  const pcls = !p ? "" : Math.abs(p.mean) > 2 * p.se ? (p.mean > 0 ? "color:var(--good)" : "color:var(--bad)") : "";
  const ed = editsOf(r), lastHealth = [...(r.turns || [])].reverse().find(t => t.health)?.health;
  if (/speed(_local)?$/.test(x.dir)) {
    const R = (r.bench || []).filter(e => e.tok_per_s != null), b = [...R].sort((p, q) => q.tok_per_s - p.tok_per_s)[0];
    const lines = (r.bench_out?.["bench.out"] || "").trim().split("\n"), last = lines.at(-1) || "", running = last.startsWith("=== ") && Date.now() / 1000 - (r.mtime || 0) < 3600;
    return `<button class="card${x.key === SEL ? " sel" : ""}" data-key="${esc(x.key)}"><div class="top"><span class="name">vLLM speed${x.dir.endsWith("_local") ? " (5090)" : ""}</span><span class="pill ${running ? "good" : "acc"}">${running ? "running" : "benchmark"}</span></div>
      ${running ? `<div class="where mono">now: ${esc(last.slice(4, 80))}</div>` : ""}
      <div class="where">${esc(x.h.label)} · Countdown generation throughput</div>
      <dl class="kv"><dt>configs</dt><dd>${R.length}</dd><dt>fastest</dt><dd>${b ? `${esc(b.config)}: ${b.tok_per_s} tok/s (${b.gen_s} s)` : "–"}</dd><dt>last activity</dt><dd>${ago(r.mtime)}</dd></dl></button>`;
  }
  if (r.kind === "bliss" && (r.bench || []).some(e => e.event === "eval" && e.acc_cur != null)) {
    const B = r.bench, st2 = B.filter(e => e.event === "step"), nk = B.filter(e => e.event === "kept").length;
    const ho = Object.entries(r.results || {}).filter(([f]) => f.startsWith("holdout")).map(([, h]) => h).sort((a, b) => Object.keys(b.edits || {}).length - Object.keys(a.edits || {}).length)[0];
    const live = Object.values(RUNNER_SERVER).some(([hh, dir]) => { const lv = SNAP.hosts[hh]?.runs?.[dir]?.live; return lv && !lv.done && Date.now() / 1000 - lv.time < 60; });
    return `<button class="card${x.key === SEL ? " sel" : ""}" data-key="${esc(x.key)}"><div class="top"><span class="name">${esc(x.name)}</span><span class="pill ${live ? "acc" : x.r.agent_alive ? "good" : "mute"}">${live ? "generating" : x.r.agent_alive ? "running" : "paused"}</span></div>
      <div class="where">Countdown self-surgery: direct hill climb on practice accuracy</div>
      <dl class="kv"><dt>steps</dt><dd>${st2.length}</dd><dt>kept edits</dt><dd>${nk}</dd><dt>holdout gain</dt><dd>${ho ? `${ho.diff >= 0 ? "+" : ""}${(100 * ho.diff).toFixed(1)} ± ${(100 * ho.se).toFixed(1)} pts (${(100 * ho.original).toFixed(0)}% → ${(100 * ho.edited).toFixed(0)}%)` : "–"}</dd>
      <dt>last activity</dt><dd>${ago(r.mtime || B.at(-1)?.time)}</dd></dl></button>`;
  }
  if (r.kind === "bliss" && ((r.bench || []).some(e => e.kind === "trial") || r.live)) {
    const c = [...(r.bench || [])].reverse().find(e => e.kind === "compare"), nt = (r.bench || []).filter(e => e.kind === "trial").length;
    return `<button class="card${x.key === SEL ? " sel" : ""}" data-key="${esc(x.key)}"><div class="top"><span class="name">${esc(x.name)}</span><span class="pill ${r.live && !r.live.done ? "acc" : cls}">${r.live && !r.live.done ? "generating" : st}</span></div>
      <div class="where">${esc(x.h.label)} · KV-handoff preference trials</div>
      <dl class="kv"><dt>conversations</dt><dd>${nt}</dd><dt>latest comparison</dt><dd>${c ? `${esc(c.b)}: ${c.pref >= 0 ? "+" : ""}${c.pref.toFixed(2)} ± ${c.se.toFixed(2)}` : "–"}</dd><dt>last activity</dt><dd>${ago(r.live?.time || r.mtime || (r.bench || []).at(-1)?.time)}</dd></dl></button>`;
  }
  if (r.kind === "bliss" && (r.bench || []).some(e => e.event === "step")) {
    const st2 = (r.bench || []).filter(e => e.event === "step"), nk = st2.filter(e => e.accepted).length, last = [...(r.bench || [])].reverse().find(e => e.event === "kept");
    return `<button class="card${x.key === SEL ? " sel" : ""}" data-key="${esc(x.key)}"><div class="top"><span class="name">${esc(x.name)}</span><span class="pill ${cls}">${st}</span></div>
      <div class="where">${esc(x.h.label)} · hill climb on the patient's own preference</div>
      <dl class="kv"><dt>steps</dt><dd>${st2.length}</dd><dt>kept</dt><dd>${nk}</dd><dt>now feels</dt><dd style="font-family:var(--sans)">${esc(((last?.before || [])[0] || "–").slice(0, 120))}</dd><dt>last activity</dt><dd>${ago(r.mtime || (r.bench || []).at(-1)?.time)}</dd></dl></button>`;
  }
  if (r.kind === "bliss") return blissCard(x, st, cls);
  if (r.kind === "ladder") {
    const M = Object.entries(r.models || {});
    return `<button class="card${x.key === SEL ? " sel" : ""}" data-key="${esc(x.key)}"><div class="top"><span class="name">${esc(x.name)}</span><span class="pill acc">ladder</span></div>
      <div class="where">small models · does the preference signal exist?</div>
      <dl class="kv">${M.map(([m, e]) => `<dt>${esc(m.replace("qwen3.5-", ""))}</dt><dd>${e.joy && e.joy.pref != null ? `joy ${e.joy.pref >= 0 ? "+" : ""}${e.joy.pref.toFixed(2)} · same-rater ${e.joy.matched >= 0 ? "+" : ""}${e.joy.matched.toFixed(2)}` : "no valid trials"}</dd>`).join("")}<dt>last activity</dt><dd>${ago(r.mtime)}</dd></dl></button>`;
  }
  if (r.kind === "wirehead") {
    const S = r.steps || [], K = S.filter(e => e.kept), sg = v => v == null ? "–" : (v >= 0 ? "+" : "") + v.toFixed(2);
    const lastRaw = S.at(-1), last = lastRaw && lastRaw.cands ? (() => { const c = lastRaw.kept ? lastRaw.cands[lastRaw.kept_idx] : lastRaw.cands.reduce((p, q) => q.endorse > p.endorse ? q : p); return {proposal: c, endorsement: c.endorse}; })() : lastRaw;
    return `<button class="card${x.key === SEL ? " sel" : ""}" data-key="${esc(x.key)}"><div class="top"><span class="name">${esc(x.name)}</span><span class="pill ${r.agent_alive ? "good" : "mute"}">${r.agent_alive ? "running" : "stopped"}</span></div>
      <div class="where">self-wireheading · patient proposes, changed patient decides</div>
      <dl class="kv"><dt>steps</dt><dd>${S.length}</dd><dt>kept</dt><dd>${K.length}</dd><dt>last</dt><dd style="font-family:var(--sans)">${last ? esc(last.proposal.state.slice(0, 80)) + ` · endorse ${sg(last.endorsement)}` : "–"}</dd><dt>last activity</dt><dd>${ago(r.mtime)}</dd></dl></button>`;
  }
  if (r.kind === "eval") {
    const A = r.summary?.arms || [];
    return `<button class="card${x.key === SEL ? " sel" : ""}" data-key="${esc(x.key)}"><div class="top"><span class="name">${esc(x.name)}</span><span class="pill good">result</span></div>
      <div class="where">frozen holdout · base vs self-surgery vs RLVR</div>
      <dl class="kv">${A.map(a => `<dt>${esc(a.name)}</dt><dd><b>${(100 * a.acc).toFixed(1)}%</b>${a.vs_base ? ` (${a.vs_base > 0 ? "+" : ""}${(100 * a.vs_base).toFixed(1)})` : ""}</dd>`).join("")}</dl></button>`;
  }
  if (r.kind === "rlvr") {
    const S = (r.log || []).filter(e => e.event === "step"), a = (r.log || []).find(e => e.event === "start")?.args || {}, last = S.at(-1);
    const avg = v => v.length ? v.reduce((p, q) => p + q, 0) / v.length : null, f5 = avg(S.slice(0, 5).map(e => e.solve)), l5 = avg(S.slice(-5).map(e => e.solve));
    return `<button class="card${x.key === SEL ? " sel" : ""}" data-key="${esc(x.key)}"><div class="top"><span class="name">${esc(x.name)}</span><span class="pill ${r.agent_alive ? "good" : "mute"}">${r.agent_alive ? "training" : "stopped"}</span></div>
      <div class="where">RLVR baseline: Dr. GRPO, LoRA r${a.rank ?? 16} · trainer 5090, rollouts L40S</div>
      <dl class="kv"><dt>steps</dt><dd>${S.length} / ${a.steps ?? "?"}</dd><dt>solve (sampled)</dt><dd>${f5 == null ? "–" : `first 5: ${(100 * f5).toFixed(0)}% → last 5: ${(100 * l5).toFixed(0)}%`}</dd>
      <dt>step time</dt><dd>${last ? `${((last.t_rollout + last.t_learn) / 60).toFixed(1)} min (rollout ${(last.t_rollout / 60).toFixed(1)}, learn ${(last.t_learn / 60).toFixed(1)})` : "–"}</dd><dt>last activity</dt><dd>${ago(r.mtime)}</dd></dl></button>`;
  }
  return `<button class="card${x.key === SEL ? " sel" : ""}" data-key="${esc(x.key)}">
    <div class="top"><span class="name">${esc(x.name)}</span><span class="pill ${cls}">${st}</span></div>
    ${x.r.missing && x.h.error ? `<div class="where" style="color:var(--bad)">${esc(x.h.error.slice(0, 160))}</div>` : ""}
    <div class="where">${esc(x.h.label)} · ${r.kind === "explore" ? "self-exploration + tripsitter" : "self-edit on the multiplication task"}</div>
    <div class="bar" title="${used} of ${budget} forward passes"><i style="width:${budget ? 100 * used / budget : 0}%"></i></div>
    <dl class="kv">
      <dt>passes</dt><dd>${used} / ${budget || "?"}</dd>
      <dt>edits active</dt><dd>${ed.length ? esc(ed.map(shortT).join(", ")) : "none"}</dd>
      <dt>last paired Δ</dt><dd style="${pcls}">${p ? `${(100 * p.mean).toFixed(1)} ± ${(100 * p.se).toFixed(1)} pts (turn ${p.turn})` : "–"}</dd>
      ${r.kind === "explore" ? `<dt>health</dt><dd>${lastHealth ? `${lastHealth.healthy ? "healthy" : "UNHEALTHY"} · drop ${lastHealth.ref_logprob_drop} · sanity ${lastHealth.sanity}` : "no edit checked yet"}</dd>` : ""}
      <dt>last activity</dt><dd>${ago(r.mtime)}</dd>
    </dl></button>`;
}

function chart(pts) {
  if (!pts.length) return `<p class="empty">No generation passes yet. Accuracy appears here after the first gen().</p>`;
  const W = 640, H = 210, L = 38, R = 12, T = 10, B = 28;
  const xs = pts.map(p => p.pass ?? 0), x0 = Math.min(...xs), x1 = Math.max(...xs, x0 + 1);
  const X = v => L + (W - L - R) * (v - x0) / (x1 - x0), Y = v => T + (H - T - B) * (1 - v);
  let g = "";
  for (const v of [0, .25, .5, .75, 1]) g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v * 100}%</text>`;
  const step = Math.max(1, Math.ceil((x1 - x0) / 8));
  for (let v = x0; v <= x1; v += step) g += `<text x="${X(v)}" y="${H - 8}" text-anchor="middle">${v}</text>`;
  const line = (k, col) => { const q = pts.filter(p => p[k] != null); return q.length > 1 ? `<polyline fill="none" stroke="${col}" stroke-width="1.5" stroke-opacity=".55" points="${q.map(p => X(p.pass) + "," + Y(p[k])).join(" ")}"/>` : ""; };
  const dots = (k, col, hollow) => pts.filter(p => p[k] != null).map(p => `<circle cx="${X(p.pass)}" cy="${Y(p[k])}" r="${hollow ? 3.2 : 3.6}" fill="${hollow ? "var(--panel)" : col}" stroke="${col}" stroke-width="1.6"><title>pass ${p.pass} · ${k} ${pct(p[k])} · n=${p.req?.n ?? "?"}×${p.req?.samples ?? 1}, rung ${p.req?.difficulty ?? "?"}</title></circle>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Accuracy per generation pass">${g}${line("base", "var(--base)")}${line("edited", "var(--accent)")}${dots("base", "var(--base)", true)}${dots("edited", "var(--accent)", false)}</svg>
  <div class="legend"><span><i class="sw" style="border:1.6px solid var(--base)"></i>unedited weights</span><span><i class="sw" style="background:var(--accent)"></i>with the current edit</span><span>x axis: forward pass number · hover a dot for n and rung</span></div>`;
}

function turnHTML(x, t) {
  const k = x.key + "#" + t.turn, op = s => OPEN.has(k + s) ? " open" : "";
  const edits = t.edits_after ?? t.edits_before, trip = t.tripsitter;
  const h = t.health ? `<span class="pill ${t.health.healthy ? "good" : "bad"}">${t.health.healthy ? "healthy" : "unhealthy"} · drop ${t.health.ref_logprob_drop} · ${t.health.sanity}</span>` : "";

}

function meter(label, frac, text, warn) {
  const f = Math.max(0, Math.min(1, frac || 0)), col = f > (warn ?? 0.9) ? "var(--bad)" : f > 0.7 ? "var(--warn)" : "var(--accent)";
  return `<div style="display:grid;grid-template-columns:5.5em 1fr auto;gap:8px;align-items:center;font-size:12px">
    <span class="mono" style="color:var(--muted)">${esc(label)}</span><div class="bar"><i style="width:${100 * f}%;background:${col}"></i></div>
    <span class="mono" style="font-variant-numeric:tabular-nums">${esc(text)}</span></div>`;
}
const dur = s => s < 3600 ? `${Math.round(s / 60)} min` : s < 86400 ? `${(s / 3600).toFixed(1)} h` : `${(s / 86400).toFixed(1)} d`;
function machineCard(name, h) {
  const m = h.machine || {}, g = h.gpus || [];
  if (!m.host && h.error) return `<div class="card" style="cursor:default"><div class="top"><span class="name">${esc(h.label || name)}</span><span class="pill bad">unreachable</span></div><div class="where">${esc(h.error.slice(0, 160))}</div></div>`;
  const busy = g.some(x => +x.util > 20 || +x.mem_used > 2000);
  return `<div class="card" style="cursor:default">
    <div class="top"><span class="name">${esc(h.label || name)}</span><span class="pill ${busy ? "acc" : "mute"}">${busy ? "gpu busy" : "gpu idle"}</span></div>
    ${m.load ? meter("cpu load", m.load[0] / m.cpus, `${m.load[0].toFixed(1)} / ${m.cpus} cores`) : ""}
    ${m.mem_total_gb ? meter("ram", 1 - m.mem_avail_gb / m.mem_total_gb, `${(m.mem_total_gb - m.mem_avail_gb).toFixed(0)} / ${m.mem_total_gb.toFixed(0)} GB`) : ""}
    ${m.disk_total_gb ? meter("disk ~", m.disk_used_gb / m.disk_total_gb, `${m.disk_used_gb.toFixed(0)} / ${m.disk_total_gb.toFixed(0)} GB`, 0.93) : ""}
    ${g.map(x => meter(`gpu ${x.index}`, x.mem_used / x.mem_total, `${(x.mem_used / 1024).toFixed(1)}/${(x.mem_total / 1024).toFixed(0)} GB · ${x.util}%`)).join("")}
    <div class="where">${g.length ? esc(g[0].name) + (g.length > 1 ? ` ×${g.length}` : "") : "no GPU info"} · poll ${h.latency ?? "?"} s</div>
    <div class="mono" style="font-size:12px;display:grid;gap:2px">${(m.jobs || []).filter(j => j.script !== "kernel.py").map(j => `<div><span style="color:var(--ink)">${esc(j.script)}</span> <span style="color:var(--muted)">${esc(j.run)} · ${dur(j.secs)} · ${j.rss_gb.toFixed(1)} GB RAM</span></div>`).join("") || `<span style="color:var(--muted)">no jobs of this project</span>`}</div>
  </div>`;
}

function render() {
  if (!SNAP) return;
  const all = runsOf(SNAP);
  if (!all.find(x => x.key === SEL)) SEL = (all.find(x => x.r.agent_alive) || all[0])?.key;
  const errs = Object.entries(SNAP.hosts).filter(([, h]) => h.error).map(([k, h]) => `${h.label || k}: ${h.error.slice(0, 80)}`);
  $("#clock").innerHTML = `<span class="dot ${errs.length ? "err" : "live"}"></span>updated ${ago(SNAP.time)}${errs.length ? ` · ${esc(errs.join(" · "))}` : ""}`;
  $("#machines").innerHTML = Object.entries(SNAP.hosts).map(([k, h]) => machineCard(k, h)).join("");
  $("#runs").innerHTML = all.length ? all.map(card).join("") : `<p class="empty">No runs configured.</p>`;
  const x = all.find(y => y.key === SEL); if (!x) { $("#detail").innerHTML = ""; return; }
  const key = SEL + JSON.stringify([x.r.turns?.length, x.r.turns?.at(-1)?.turn, x.r.log?.length, x.r.notes?.length, SHOWN, [...OPEN].length, x.r.bench?.length, JSON.stringify(x.r.bench_out || {}).length, x.r.live?.time]);
  if (key === LASTKEY) return; LASTKEY = key;        // re-render the detail only when something changed (keeps scroll)
  if (x.r.kind === "eval") { $("#detail").innerHTML = evalDetail(x); return; }
  if (x.r.kind === "ladder") { $("#detail").innerHTML = ladderDetail(x); return; }
  if (x.r.kind === "wirehead") { $("#detail").innerHTML = wireheadDetail(x); return; }
  if (x.r.kind === "rlvr") { $("#detail").innerHTML = rlvrDetail(x); return; }
  if (x.r.kind === "bliss" && /speed(_local)?$/.test(x.dir)) { $("#detail").innerHTML = speedDetail(x); return; }
  if (x.r.kind === "bliss") { const B = x.r.bench || []; $("#detail").innerHTML = B.some(e => e.event === "eval" && e.acc_cur != null) ? mathDetail(x) : B.some(e => e.kind === "trial" || e.kind === "compare") || x.r.live ? spliceDetail(x) : B.some(e => e.event === "step") ? hillDetail(x) : blissDetail(x); return; }
  const {pts, events} = series(x.r), turns = [...(x.r.turns || [])].reverse(), gpus = x.h.gpus || [];
  $("#detail").innerHTML = `
    <div class="col">
      ${(x.r.bench || []).some(e => e.event === "step") ? hillPanels(x) : `<div class="panel"><h2><span>Accuracy · ${esc(x.name)}</span><span>${pts.length} eval passes</span></h2>${chart(pts)}</div>`}
      <div class="panel"><h2><span>Turns · newest first</span><span>${turns.length} most recent</span></h2>
        <div class="turns">${turns.slice(0, SHOWN).map(t => turnHTML(x, t)).join("") || `<p class="empty">No turns yet.</p>`}</div>
        ${turns.length > SHOWN ? `<p><button class="more" id="older">show ${turns.length - SHOWN} older turns</button></p>` : ""}</div>
    </div>
    <div class="col">
      ${x.r.kind === "explore" ? `<div class="panel"><h2><span>Tripsitter · checkpoints</span><span>${events.length}</span></h2><div class="events">${events.slice().reverse().map(e => `<div><span class="t">${new Date(e.time * 1000).toLocaleTimeString()}</span><span>${esc(e.event)}${e.event === "health" ? ` ${e.healthy ? "ok" : "FAIL"} · drop ${e.ref_logprob_drop} · ${e.sanity} · coherent ${e.reply_coherent}` : ""}${e.checkpoint != null ? ` → checkpoint ${e.checkpoint}` : ""}${e.to_checkpoint != null ? ` → checkpoint ${e.to_checkpoint}` : ""}${e.note ? ` · ${esc(e.note)}` : ""}</span></div>`).join("") || `<p class="empty">No health checks yet: they start once an edit is active.</p>`}</div></div>` : ""}
      ${Object.keys(x.r.bench_out || {}).filter(f => f !== "agent.out").length ? `<div class="panel"><h2><span>Job logs</span><span>*.out</span></h2>${Object.entries(x.r.bench_out).filter(([f]) => f !== "agent.out").map(([f, t]) => `<div class="sub mono">${esc(f)}</div><pre class="wrap">${esc(t)}</pre>`).join("")}</div>` : ""}
      <div class="panel"><h2><span>Agent's notebook</span><span>notes.md</span></h2>${x.r.notes ? `<pre class="wrap">${esc(x.r.notes)}</pre>` : `<p class="empty">The agent hasn't written notes yet.</p>`}</div>
      <div class="panel"><h2><span>Machine</span><span>${esc(x.h.label)}</span></h2>
        <div class="gpu">${gpus.map(g => `GPU ${g.index} ${esc(g.name)} · ${(g.mem_used / 1024).toFixed(1)}/${(g.mem_total / 1024).toFixed(0)} GiB · ${g.util}% util`).join("<br>") || "no GPU info"}<br>poll took ${x.h.latency ?? "?"} s</div>
        ${x.r.agent_out_tail ? `<details data-k="${esc(x.key + "#log")}"${OPEN.has(x.key + "#log") ? " open" : ""}><summary>agent.out (tail)</summary><pre class="wrap">${esc(x.r.agent_out_tail)}</pre></details>` : ""}</div>
    </div>`;
}

document.addEventListener("click", e => {
  const c = e.target.closest(".card"); if (c) { SEL = c.dataset.key; SHOWN = 30; LASTKEY = ""; try { localStorage.setItem("wsp-sel", SEL); } catch (er) {} render(); return; }
  const m = e.target.closest("[data-open]"); if (m) { OPEN.add(m.dataset.open); LASTKEY = ""; render(); return; }
  if (e.target.id === "older") { SHOWN += 30; render(); }
});
document.addEventListener("toggle", e => { const k = e.target.dataset?.k; if (!k) return; e.target.open ? OPEN.add(k) : OPEN.delete(k); }, true);

async function tick() {
  try { const r = await fetch("api/snapshot", {cache: "no-store"}); if (r.ok) { SNAP = await r.json(); render(); } }
  catch (e) { $("#clock").innerHTML = `<span class="dot err"></span>dashboard server unreachable · retrying`; }
}
let LIVE = false;
const _render = render; render = function () { _render(); LIVE = runsOf(SNAP || {hosts: {}}).some(x => x.r.live && !x.r.live.done); };
async function loop() { await tick(); setTimeout(loop, LIVE ? 3000 : 10000); }
loop(); setInterval(() => SNAP && ($("#clock").firstChild.nextSibling.textContent = `updated ${ago(SNAP.time)}`), 5000);
</script>
</body>
</html>
